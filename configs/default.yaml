# Main experiment: pixel DQN vs latent DQN on CartPole-v1 (3 seeds, 100k steps each)
env:
  env_id: CartPole-v1
  image_size: 64
  crop_rows: [150, 350]
  frame_stack: 4

autoencoder:
  latent_dim: 16
  num_frames: 30000
  diverse_initial_states: true
  data_seed: 123
  epochs: 30
  learning_rate: 0.001
  batch_size: 256
  foreground_loss_weight: 10.0
  validation_fraction: 0.1

agent:
  total_timesteps: 100000
  eval_every_steps: 5000
  eval_episodes: 10
  success_threshold: 400.0
  dqn_pixel:
    learning_rate: 0.0001
    batch_size: 64
    buffer_size: 20000
    learning_starts: 2000
    gamma: 0.99
    target_update_interval: 500
    train_freq: 4
    gradient_steps: 1
    exploration_fraction: 0.2
    exploration_final_eps: 0.05
  dqn_latent:
    learning_rate: 0.0023
    batch_size: 64
    buffer_size: 100000
    learning_starts: 1000
    gamma: 0.99
    target_update_interval: 10
    train_freq: 256
    gradient_steps: 128
    exploration_fraction: 0.16
    exploration_final_eps: 0.04
    net_arch: [256, 256]

experiment:
  name: main
  seeds: [0, 1, 2]
  output_dir: outputs
  device: auto
