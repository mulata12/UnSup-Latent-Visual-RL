[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-visual-rl"
version = "1.0.0"
description = "Unsupervised state representation learning (CAE) for sample-efficient visual RL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.scripts]
lvrl = "latent_visual_rl.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
